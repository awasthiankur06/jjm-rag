<VirtualHost *:443>
    ServerName REPLACE_WITH_APPROVED_DNS_NAME

    SSLEngine on
    SSLCertificateFile REPLACE_WITH_MANAGED_CERTIFICATE_PATH
    SSLCertificateKeyFile REPLACE_WITH_MANAGED_PRIVATE_KEY_PATH

    LimitRequestBody 2097152
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    # Keep Server-Sent Events open while the model produces a grounded answer.
    # This more-specific rule must precede the catch-all ProxyPass rule.
    ProxyPass        /api/v1/query/stream http://127.0.0.1:8000/api/v1/query/stream connectiontimeout=5 timeout=900
    ProxyPassReverse /api/v1/query/stream http://127.0.0.1:8000/api/v1/query/stream
    ProxyPass        / http://127.0.0.1:8000/ connectiontimeout=5 timeout=90
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  /var/log/httpd/jjm-rag-error.log
    CustomLog /var/log/httpd/jjm-rag-access.log combined
</VirtualHost>
