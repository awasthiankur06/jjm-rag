[project]
name = "jjm-rag"
version = "0.1.0"
description = "Hybrid RAG ingestion and retrieval foundation for the JJM corpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "pdfplumber>=0.10.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0"
  ,"psycopg[binary]>=3.2.0"
  ,"qdrant-client>=1.14.0"
  ,"google-genai>=1.30.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
